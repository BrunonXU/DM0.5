<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F1 录制提示音 · 试听</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f6;color:#202125;font:17px system-ui,sans-serif}main{max-width:1050px;margin:60px auto;padding:32px}h1{font-size:32px;margin:0 0 16px}p{color:#686b73;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:28px 0}article{background:white;border:1px solid #e5e5e8;border-radius:20px;padding:28px}h2{font-size:22px;margin:0}audio{width:100%;margin-top:12px}a{color:#315d88}small{color:#747780}@media(max-width:680px){.grid{grid-template-columns:1fr}main{margin:16px auto;padding:20px}}</style><main><h1>录制提示音 · 先试听</h1><p>选一个开始音、一个保存完成音。仅在当前浏览器播放，尚未接入录制，也不会从机器人扬声器播放。</p><p>建议先听 A 组。候选已降低音量；实际响度仍取决于设备音量。</p><div class="grid"><article><div><h2>开始 A</h2><p>短确认音 · 0.29 秒</p></div><audio controls preload="none" src="start-a.wav"></audio></article><article><div><h2>完成 A</h2><p>拨弦短旋律 · 1.00 秒</p></div><audio controls preload="none" src="saved-a.wav"></audio></article><article><div><h2>开始 B</h2><p>界面上扬提示 · 0.38 秒</p></div><audio controls preload="none" src="start-b.wav"></audio></article><article><div><h2>完成 B</h2><p>短确认音 · 0.54 秒</p></div><audio controls preload="none" src="saved-b.wav"></audio></article></div><small>来源：Kenney · <a href="https://kenney.nl/assets/interface-sounds">Interface Sounds</a> / <a href="https://kenney.nl/assets/music-jingles">Music Jingles</a> · CC0。仅做音量衰减、轻微淡入淡出与 WAV 转码。</small></main><script>const sounds=[...document.querySelectorAll('audio')];sounds.forEach(a=>{a.volume=.7;a.addEventListener('play',()=>sounds.forEach(b=>{if(b!==a){b.pause();b.currentTime=0;}}));});</script></html>
