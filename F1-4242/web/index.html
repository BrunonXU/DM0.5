<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f6f9">
  <meta name="referrer" content="same-origin">
  <title>F1-infra</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/platform.css">
  <link rel="stylesheet" href="/data-workspace.css">
  <link rel="stylesheet" href="/hil-workspace.css">
  <link rel="stylesheet" href="/replay-workspace.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand infra-brand" href="#overview" aria-label="F1-infra 首页"><span class="infra-name">F1-infra</span></a>
      <button id="toggle-navigation" class="button nav-toggle" data-click="toggle-nav" type="button" aria-label="收起或展开导航" aria-expanded="true" title="收起或展开导航"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16m7-11-3 3 3 3"/></svg></button>
      <div class="sidebar-label">工作空间</div>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom"><span class="small-dot" id="sidebar-dot"></span><span id="sidebar-status">正在连接本地服务</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb">F1-infra <span>/</span> <strong id="breadcrumb-title">总览</strong></div>
        <div class="topbar-actions"><button class="button small" id="control-mode-exit" data-click="release" hidden>操控中 · 退出操控</button><button id="teleop-indicator" class="recording-indicator-button" data-nav="pico" type="button" hidden></button><button id="recording-indicator" class="recording-indicator-button" data-nav="pico" type="button" hidden></button><span class="pill neutral" id="connection-pill"><span class="small-dot"></span>正在连接</span><span id="robot-label" class="robot-label">F1</span><button id="stop-button" class="button stop-button" type="button" title="只停止本工作台拥有的动作，不代替硬件急停">停止当前动作</button></div>
      </header>
      <div id="global-alert" class="global-alert" role="status" hidden></div>
      <main id="main" tabindex="-1"></main>
      <footer class="workspace-footer"><span>实时反馈 · F1 / 4242</span><span id="updated-at">尚未同步</span></footer>
    </div>
  </div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <dialog id="execute-dialog" class="execute-dialog"><form id="execute-form"><div class="dialog-kicker">现场执行</div><h2>进入操控模式并执行</h2><p id="execute-description"></p><details class="mt"><summary>目标角度</summary><div id="execute-targets" class="target-preview"></div></details><p class="muted">确认现场空间后授权执行。操控模式保持有效，退出后需重新授权。</p><label class="field-label mt" for="execute-code">授权码</label><input id="execute-code" type="password" autocomplete="off" required style="width:100%"><p id="execute-error" role="alert"></p><div class="dialog-actions"><button type="button" class="button" id="cancel-execute">返回编辑</button><button type="submit" class="button primary" id="confirm-execute">确认执行</button></div></form></dialog>
  <input type="file" id="preset-file" accept="application/json,.json" hidden>
</body>
</html>
