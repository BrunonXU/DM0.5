<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Why&amp;How · 理解，再实践</title>
  <link rel="stylesheet" href="/web/app.css">
  <script defer src="/web/vendor/mermaid.min.js"></script>
  <script defer src="/web/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#reading-area">跳到正文</a>
  <header class="topbar">
    <button id="open-library" class="icon-button" type="button" aria-label="打开文章目录" aria-haspopup="dialog" aria-controls="library-dialog" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
    <a class="brand" href="/" aria-label="Why and How 首页">
      <span><strong>Why<span>&amp;</span>How</strong></span>
    </a>
    <nav class="mode-tabs" role="tablist" aria-label="阅读方式">
      <button id="tab-html" class="mode-tab" type="button" role="tab" aria-selected="true" aria-controls="content-panel" data-kind="html">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="m8 6 5 4-5 4z"/></svg>
        交互讲解 <span id="html-count" class="tab-count">0</span>
      </button>
      <button id="tab-markdown" class="mode-tab" type="button" role="tab" aria-selected="false" aria-controls="content-panel" data-kind="markdown" tabindex="-1">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3h9l3 3v11H4zM12 3v4h4M7 10h6M7 13h6"/></svg>
        文字阅读 <span id="markdown-count" class="tab-count">0</span>
      </button>
    </nav>
    <div class="top-actions">
      <span class="local-status">理解，再实践</span>
      <button id="refresh" class="icon-button" type="button" title="重新读取目录与当前内容" aria-label="刷新内容">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 7a6.5 6.5 0 1 0 .3 5M16 3v4h-4"/></svg>
      </button>
    </div>
  </header>

  <div class="workspace">


    <main id="content-panel" class="content-panel" role="tabpanel" aria-labelledby="tab-html">
      <div class="document-bar">
        <div class="document-context"><span id="context-kind">交互讲解</span><span class="context-divider">/</span><span id="context-title">选择一篇内容</span></div>
        <div class="document-actions">
          <a id="open-interactive" class="text-button" href="#" target="_blank" rel="noopener noreferrer" hidden>独立窗口 <span aria-hidden="true">↗</span></a>
          <button id="copy-link" class="text-button" type="button" disabled>复制链接 <span aria-hidden="true">↗</span></button>
        </div>
      </div>
      <div id="reading-area" class="reading-area" tabindex="-1">
        <div id="loading" class="state-card" role="status"><span class="loading-dot"></span><h1>正在准备内容</h1><p>从本地文件中整理讲解与笔记。</p></div>
        <div id="error" class="state-card error-card" role="alert" hidden><span class="state-symbol">!</span><h1 id="error-title">暂时无法打开</h1><p id="error-message"></p><button id="retry" class="primary-button" type="button">重新加载</button></div>
        <article id="document" class="document" hidden>
          <div class="article-meta"><span id="article-category" class="eyebrow">READ &amp; UNDERSTAND</span><span id="article-date"></span></div>
          <div id="markdown-body" class="markdown-body"></div>
          <footer class="article-footer"><span class="tiny-rule"></span><p>理解原理，也保留每一步的依据。</p><span id="article-source"></span></footer>
        </article>
        <section id="interactive" class="interactive" aria-label="交互讲解" hidden>
          <div class="interactive-intro"><div><span class="eyebrow">交互讲解</span><h1 id="interactive-title"></h1><p id="interactive-description"></p></div><span class="interactive-pill">可交互</span></div>
          <div class="iframe-wrap"><iframe id="interactive-frame" title="交互讲解内容" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe><p id="iframe-status" class="iframe-status" role="status">正在载入交互内容…</p></div>
        </section>
      </div>
    </main>

    <aside class="reading-tools" aria-label="阅读辅助">
      <div class="tools-title">阅读设置</div>
      <div class="font-control" role="group" aria-label="正文字号">
        <button type="button" data-font="compact" title="紧凑字号" aria-label="紧凑字号" aria-pressed="false"><span class="font-small">A</span></button>
        <button type="button" data-font="standard" title="标准字号" aria-label="标准字号" aria-pressed="true">A</button>
        <button type="button" data-font="large" title="舒适字号" aria-label="舒适字号" aria-pressed="false"><span class="font-large">A</span></button>
      </div>
      <div class="toc-heading"><span>本篇章节</span><span id="reading-progress">0%</span></div>
      <nav id="toc" class="toc" aria-label="本篇章节"><p class="toc-placeholder">打开一篇笔记，<br>从这里找到重点。</p></nav>
      <div class="source-card"><span>内容来源</span><p id="source-label">本地 Projects</p><small id="source-updated"></small></div>
    </aside>
  </div>

    <dialog id="library-dialog" class="library" aria-label="内容目录">
      <div class="library-heading"><span>文章目录 <small id="item-count" class="muted"></small></span><button id="close-library" class="icon-button" type="button" aria-label="关闭文章目录">✕</button></div>
      <label class="search-box">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5"/><path d="m12.5 12.5 4 4"/></svg>
        <input id="search" type="search" placeholder="搜索标题或主题…" autocomplete="off" aria-label="搜索内容目录">
        <kbd title="Ctrl 或 Command + K">⌘ K</kbd>
      </label>
      <div id="catalog" class="catalog" aria-live="polite">
        <p class="sidebar-message">正在打开书架…</p>
      </div>
      <div class="library-footer"><span class="tiny-rule"></span><p>把问题读懂，<br>让下一步更清楚。</p><small id="service-label">Why&amp;How</small></div>
    </dialog>

  <dialog id="image-dialog" class="image-dialog" aria-label="查看原图">
    <div class="image-toolbar"><span id="image-caption">原图</span><button id="close-image" class="text-button" type="button">关闭 <kbd>Esc</kbd></button></div>
    <img id="full-image" alt="">
    <a id="open-image" target="_blank" rel="noopener noreferrer">在新窗口查看原图 ↗</a>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
