[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g2teleop"
version = "0.1.0"
description = "Safety-gated F710 teleoperation transport for G2 DM0.5 DAgger"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
ipad = ["hebi-py>=2.8.0,<2.12.0"]
windows = ["pygame>=2.5,<3"]
kinematics-data = ["h5py>=3.10,<4"]
kinematics-ik = [
  "pin==3.7.0",
  "pin-pink==4.3.0",
  "qpsolvers==4.13.0",
  "proxsuite==0.7.3",
  "cmeel-urdfdom==4.0.1",
  "cmeel-tinyxml2==10.0.0",
]
otg = ["ruckig==0.19.4"]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
