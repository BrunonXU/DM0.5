# Loaded by f1-harness; direct Responses driver exposes only python and finish.
schema_version = 1

[planner]
provider = "openai"
runtime = "responses"
wire_api = "responses"
base_url = "https://api.openai.com/v1"
model = "gpt-6.2-astra"
reasoning_effort = "high"
credentials_file = "API.MD"
# Local credential loader: read only in planner process; never send the file
# to an LLM, echo it, pass it in CLI arguments, or inherit it in code-cell workers.

[execution]
mode = "offline"
allow_robot_actions = false
allow_training = false
# Hardware authority is a bound infra start consumed by the original F1 owner;
# the legacy physical-START entry remains separate. This config never authorizes motion.

[memory]
read_scope = "verified_snapshot"
candidate_scope = "inbox"
automatic_promotion = false
