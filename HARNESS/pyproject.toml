[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-harness"
version = "0.0.0"
description = "F1 semantic skills, observation, verification and agent integration"
requires-python = ">=3.11,<3.12"
dependencies = [
  "rpent", "pyrualean", "pillow>=10", "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3", "scipy>=1.12", "httpx>=0.27", "mcp>=1.23,<2",
  "uvicorn>=0.27", "pydantic>=2", "PyYAML>=6", "PyJWT[crypto]>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2", "ruff>=0.8"]

[project.scripts]
f1-harness = "f1_harness.cli:main"

[tool.uv.sources]
rpent = { path = "third_party/RPent" }
pyrualean = { path = "third_party/PyRUA-Lean" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f1_harness = ["knowledge/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
