const baseEvents=[{time_s:0,title:'任务已开始',detail:{mode:'astra',task:'single_block'}},{time_s:1,title:'设备与标定复核通过',detail:{result:'ready'}},{time_s:8,title:'观察方块与孔口',detail:{tool:'observe'}},{time_s:18,title:'接近方块',detail:{tool:'approach_grasp',phase:'approach'}},{time_s:23,title:'等待动作结果',detail:{tool:'wait_for_result'}}];
function events(){const rows=structuredClone(baseEvents);if(state==='review'){rows[4]={time_s:23,title:'控制端确认保持',detail:{kind:'hold_acknowledged'}};rows.push({time_s:35,title:'结果待审核',detail:{status:'pending_review'}})}if(state==='error')rows.push({time_s:35,title:'未取得有效观测',message:'头部画面暂不可用。',level:'error',detail:{reason:'observation_unavailable'}});if(state==='waiting')rows.push({time_s:30,title:'等待新观测',detail:{status:'waiting',camera:'head'}});return rows}
function renderLogs(){let list=events().filter(e=>(!onlyErrors||e.level==='error')&&(!query||JSON.stringify(e).toLowerCase().includes(query.toLowerCase())));$('#event-count').textContent=list.length+' 条事件';$('#filter').setAttribute('aria-pressed',onlyErrors);document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));$('#log-feed').innerHTML=!list.length?'<div class="empty">没有匹配的事件</div>':tab==='raw'?list.map(e=>`<pre class="raw">${esc(JSON.stringify(e,null,2))}</pre>`).join(''):list.map(e=>`<article class="event ${e.level==='error'?'error':''}"><time>${format(e.time_s)}</time><h3>${esc(e.title)}</h3>${e.message?`<p>${esc(e.message)}</p>`:''}<details><summary>详情</summary><pre>${esc(JSON.stringify(e.detail,null,2))}</pre></details></article>`).join('');if($('#follow').checked)$('#log-feed').scrollTop=$('#log-feed').scrollHeight}
function tick(){const value=format(elapsed());if($('#elapsed').textContent!==value)$('#elapsed').textContent=value}
function changeState(value,seconds=35){state=value;baseSeconds=seconds;anchor=performance.now();const s=states[state];$('#run-state').dataset.state=state;$('#run-state').innerHTML=(state==='error'?icon('error'):'<i class="dot"></i>')+s.label;$('#run-button').innerHTML=icon(active()?'stop':'play')+(active()?'停止任务':'开始任务');$('#current-action').textContent=s.action;$('#locate').hidden=state!=='error';document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.state===state));onlyErrors=false;tick();renderLogs()}
function showDetail(title,body){$('#detail-title').textContent=title;$('#detail-body').innerHTML=body;$('#detail-dialog').showModal()}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,2200)}
for(const name of ['head','left','right'])$('#camera-'+name).src=images[name];
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close')){b.closest('dialog').close();return}if(b.dataset.state){changeState(b.dataset.state);return}if(b.dataset.tab){tab=b.dataset.tab;renderLogs();return}if(b.dataset.photo){$('#photo').src=images[b.dataset.photo];$('#photo-title').textContent=({head:'头部',left:'左腕',right:'右腕'})[b.dataset.photo];$('#photo-dialog').showModal();return}switch(b.dataset.action){case 'run':changeState(active()?'review':'running',active()?elapsed():0);break;case 'config':$('#config-dialog').showModal();break;case 'history':$('#history-dialog').showModal();break;case 'task':showDetail('抓积木','<p>将单个方块放入匹配方孔。</p>');break;case 'run-detail':$('#history-dialog').close();showDetail('本次运行','<dl><dt>结果</dt><dd>待审核</dd><dt>用时</dt><dd>00:35</dd><dt>运行</dt><dd>单块完整流程 · cbbb19be</dd><dt>来源</dt><dd>真机记录</dd><dt>执行方式</dt><dd>Astra 规划</dd></dl>');break;case 'search':$('#search-row').hidden=false;$('#search').focus();break;case 'close-search':$('#search-row').hidden=true;query='';$('#search').value='';renderLogs();break;case 'locate':tab='process';onlyErrors=true;renderLogs();const item=$('.event.error');if(item){item.querySelector('details').open=true;item.scrollIntoView({block:'nearest'})}break;case 'export':const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([events().map(e=>JSON.stringify({...e,synthetic:true})).join('\n')],{type:'application/x-ndjson'}));a.download='layout-preview-events.jsonl';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);break}});
$('#filter').onclick=()=>{onlyErrors=!onlyErrors;renderLogs()};$('#search').oninput=e=>{query=e.target.value;renderLogs()};$('#config-form').onsubmit=e=>{e.preventDefault();$('#config-dialog').close();toast('已保存预览配置')};
const initial=new URLSearchParams(location.search).get('state');changeState(Object.hasOwn(states,initial)?initial:'review');
const timer=setInterval(tick,100);addEventListener('pagehide',()=>clearInterval(timer));
const observer=new ResizeObserver(()=>{$('.console').style.minHeight=Math.max(400,Math.ceil($('.camera-panel').getBoundingClientRect().height))+'px'});observer.observe($('.camera-panel'));
</script>
</body></html>
