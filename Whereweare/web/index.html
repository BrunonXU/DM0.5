<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef"><title>Whereweare · 现在</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/" data-action="home">Whereweare<span class="brand-mark">↗</span></a>
    <nav aria-label="工作区"><button class="nav-current" data-action="home"><span aria-hidden="true">◉</span>现在</button><button data-action="library"><span aria-hidden="true">▦</span>项目库</button><button id="review-menu" data-action="report" data-mode="daily"><span aria-hidden="true">◷</span>回顾</button></nav>
    <div class="sidebar-bottom"><div id="repository-nav"></div><button data-action="sync">更新状态 <span aria-hidden="true">↗</span></button></div>
  </aside>
  <main>
    <header class="topbar"><span id="context-label">PROJECTS / 现在</span><div class="header-actions"><button id="connection-error" class="connection-error" data-action="sync" role="status" hidden></button><button id="snapshot-note" data-action="sync"></button><button class="update-button" id="update-now" data-action="review" data-mode="update">更新进度</button></div></header>
    <section class="intro" aria-labelledby="project-title">
      <div class="title-row"><button class="project-heading" id="project-heading" data-action="expand"><h1 id="project-title">项目手记</h1></button><button id="project-menu" class="menu-button" data-action="project" aria-label="项目设置">⋯</button></div>
      <p id="project-summary" class="project-summary">正在读取项目状态…</p>
      <button id="back-global" class="back-link" data-action="back" hidden>← 返回原视图</button>
    </section>
    <section id="architecture" class="architecture" aria-label="整体链路与验收状态"></section>
    <div class="timeline-toolbar"><div class="timeline-tabs"><strong>推进轨迹</strong><button id="pending-update" data-action="apply-update" hidden>有新进展 · 载入</button></div><div class="timeline-controls"><div class="range-control" role="group" aria-label="时间范围"><button data-action="range" data-range="fortnight" aria-pressed="true">近两周</button><button data-action="range" data-range="month" aria-pressed="false">近一月</button><button data-action="range" data-range="all" aria-pressed="false">全部</button></div><button data-action="pan" data-delta="-7" aria-label="向前查看一周">←</button><button data-action="pan" data-delta="7" aria-label="向后查看一周">→</button><button id="return-now" data-action="today" hidden>回到现在</button></div></div>
    <section id="graphstage" class="graphstage" aria-label="横向项目时间线">
      <div id="lane-labels" class="lane-labels"></div><div id="plot-viewport" class="plot-viewport" tabindex="0" aria-label="项目时间线，左右方向键查看历史"><svg id="timeline" role="group" aria-label="项目变化与支撑进展" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div id="empty-message" class="empty-message" role="status" hidden></div>
    </section>
    <footer class="canvas-bottom"><div class="event-legend" aria-label="记录类型"><span>● 成果</span><span>□ 改动</span><span>◇ 决定</span><span>△ 待验证</span></div><button id="expand-support" class="expand-link" data-action="expand">展开全部记录 ↗</button><button id="sync-status" data-action="sync" hidden></button></footer>
  </main>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"></dialog>
  <dialog id="form-dialog" class="form-dialog" aria-labelledby="form-title"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js" defer></script>
</body>
</html>
