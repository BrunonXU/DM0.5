# Diagnostic only: parent1K weights, fresh Adam/cursor, no random augmentation, 16 audited anchors.
defaults:
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:RLINF_ROOT}/examples/sft/config

cluster:
  num_nodes: 1
  component_placement:
    actor: ${oc.env:F1_TOYS_GPU_INDEX}

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:F1_TOYS_RUN}
    project_name: f1_complexytoys
    experiment_name: ReleaseChain_TinyFit_16_B16
    logger_backends: [tensorboard, wandb]
    wandb_proxy: http://127.0.0.1:18096
  max_epochs: -1
  max_steps: 100
  val_check_interval: 100
  save_interval: 100
  resume_dir: null

data:
  train_data_paths: ${oc.env:F1_TOYS_DATASET}
  val_data_paths: ${oc.env:F1_TOYS_VALIDATION}
  num_workers: 0
  allow_smoke_only: false
  contract_sha256: ${oc.env:F1_TOYS_CONTRACT_SHA256}
  norm_stats_sha256: ${oc.env:F1_TOYS_NORM_STATS_SHA256}
  split_sha256: ${oc.env:F1_TOYS_SPLIT_SHA256}

actor:
  group_name: F1ToysSFT
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 16
  eval_batch_size: 2
  seed: 20261023
  model:
    model_path: /u01/user/runs/f1-toys-v1-dagger-20261022-r3/bundle-1000
    precision: fp32
    num_action_chunks: 50
    action_dim: 16
    openpi:
      config_name: pi05_f1_toys
      task: sft
      f1_native_lora: false
      f1_full_sft: true
      train_image_augmentation: false
      mask_inactive_action_inputs: true
      action_loss_mask: [true, true, true, true, true, true, true, true, true, true, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false]
  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.0
    clip_grad: 1.0
    total_training_steps: 100
    lr_warmup_steps: 0
    lr_scheduler: constant
    min_lr: null
    min_lr_rate: 0.1
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: false
critic:
  use_critic_model: false
